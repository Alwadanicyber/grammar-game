<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Word Catcher Game - Alwadani</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(30, 41, 59, 0.85);
      --accent: #38bdf8;
      --correct: #22c55e;
      --wrong: #ef4444;
    }
    
    body {
      margin: 0;
      font-family: 'Tajawal', 'Nunito', sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.1) 0%, transparent 50%);
      color: white;
      overflow: hidden; 
      touch-action: manipulation; 
    }

    /* Screen Management */
    .screen { display: none; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; flex-direction: column; }
    .screen.active { display: flex; animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Glass Effect UI */
    .glass-ui {
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    /* Falling Words */
    #game-area {
      flex-grow: 1;
      position: relative;
      overflow: hidden;
      width: 100%;
    }
    .falling-word {
      position: absolute;
      padding: 0.7rem 1.2rem;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 2px solid #38bdf8;
      border-radius: 99px;
      font-weight: 900;
      font-size: clamp(1rem, 4vw, 1.25rem); /* Flexible size */
      font-family: 'Nunito', sans-serif;
      color: white;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(56, 189, 248, 0.2);
      transition: transform 0.1s;
      user-select: none;
      direction: ltr;
      white-space: nowrap;
    }
    .falling-word:active { transform: scale(0.9); }
    
    @keyframes pop {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.8; background: var(--correct); border-color: white; }
      100% { transform: scale(0); opacity: 0; }
    }
    .pop-effect { animation: pop 0.4s forwards; pointer-events: none; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      50% { transform: translateX(10px); }
      75% { transform: translateX(-10px); }
    }
    .shake-effect { animation: shake 0.3s forwards; background: var(--wrong) !important; border-color: white !important; pointer-events: none;}

    /* Top Bar & Bottom Bar */
    #top-bar { height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 1.5rem; z-index: 10; }
    #question-bar { 
      min-height: 110px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; z-index: 10;
      border-top: 2px solid rgba(56, 189, 248, 0.3);
    }

    /* Hearts */
    .heart { color: #ef4444; transition: opacity 0.3s; }
    .heart.lost { opacity: 0.2; filter: grayscale(100%); }

    /* Logo */
    .lux-logo {
      background: linear-gradient(135deg, #FFDF00, #D4AF37, #996515);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      border: 2px solid #D4AF37;
      background-color: rgba(15, 23, 42, 0.8);
      font-weight: 900;
    }
  </style>
</head>
<body>

  <!-- Screen 0: Start Screen -->
  <div id="start-screen" class="screen active justify-center items-center p-6">
    <div class="glass-ui rounded-3xl p-8 md:p-12 max-w-lg w-full text-center border-t-4 border-t-sky-400">
      
      <div class="flex justify-center mb-6">
        <div class="lux-logo px-6 py-2 rounded-full flex items-center gap-2 text-xl shadow-2xl">
          <i data-lucide="sparkles" class="w-5 h-5 text-yellow-400"></i> ALWADANI
        </div>
      </div>

      <h1 class="text-4xl md:text-5xl font-black mb-4 bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-blue-500">صائد الكلمات</h1>
      <p class="text-slate-300 text-lg mb-8 leading-relaxed font-bold">
        اقرأ السؤال في الأسفل، واضغط على الإجابة الصحيحة وهي تتساقط ببطء قبل أن تلمس الأرض! <br>
        <span class="text-sky-300 text-sm">(20 سؤال: مفردات وقواعد)</span>
      </p>

      <div class="mb-8">
        <input type="text" id="player-name" placeholder="ما اسمك يا محقق؟" class="w-full bg-slate-800 border-2 border-slate-600 rounded-xl p-4 text-center text-xl font-bold text-white outline-none focus:border-sky-400 transition-colors" autocomplete="off">
      </div>

      <button onclick="startGame()" class="w-full bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-black text-2xl py-4 rounded-xl shadow-[0_0_20px_rgba(56,189,248,0.4)] transition-transform hover:scale-105 active:scale-95 flex justify-center items-center gap-3">
        العب الآن <i data-lucide="play" class="w-7 h-7 fill-white"></i>
      </button>
    </div>
  </div>

  <!-- Screen 1: Game Screen -->
  <div id="game-screen" class="screen">
    
    <!-- Top HUD -->
    <div id="top-bar" class="glass-ui">
      <!-- Lives -->
      <div class="flex gap-1" id="lives-container">
        <i data-lucide="heart" class="w-6 h-6 md:w-8 md:h-8 heart fill-red-500"></i>
        <i data-lucide="heart" class="w-6 h-6 md:w-8 md:h-8 heart fill-red-500"></i>
        <i data-lucide="heart" class="w-6 h-6 md:w-8 md:h-8 heart fill-red-500"></i>
      </div>
      
      <!-- Progress -->
      <div class="text-center">
        <p class="text-xs text-sky-300 font-bold uppercase tracking-wider mb-1">المرحلة <span id="round-indicator">1</span></p>
        <p class="text-sm md:text-base font-black text-white"><span id="q-current">1</span> / <span id="q-total">20</span></p>
      </div>

      <!-- Score -->
      <div class="flex items-center gap-2 bg-slate-800 px-4 py-1.5 rounded-lg border border-slate-600">
        <i data-lucide="star" class="w-4 h-4 text-yellow-400 fill-yellow-400"></i>
        <span id="score-display" class="font-black text-xl text-yellow-400">0</span>
      </div>
    </div>

    <!-- Falling Area -->
    <div id="game-area"></div>

    <!-- Bottom Question Area -->
    <div id="question-bar" class="glass-ui relative">
      <button onclick="readQuestion()" class="absolute top-[-20px] left-1/2 transform -translate-x-1/2 bg-sky-500 rounded-full p-2 shadow-lg border-2 border-slate-900 z-20 transition-transform active:scale-90">
        <i data-lucide="volume-2" class="w-5 h-5 text-white"></i>
      </button>
      <p id="question-text" class="text-xl md:text-3xl font-black text-white mt-2 leading-snug" dir="ltr"></p>
      <p id="question-ar" class="text-sky-300 font-bold mt-2 text-sm md:text-base"></p>
    </div>
  </div>

  <!-- Screen 2: Game Over / Finish -->
  <div id="result-screen" class="screen justify-center items-center p-6">
    <div class="glass-ui rounded-3xl p-8 md:p-12 max-w-lg w-full text-center border-t-4 border-t-yellow-400">
      <div class="w-24 h-24 bg-gradient-to-br from-yellow-300 to-amber-500 rounded-full mx-auto flex justify-center items-center shadow-[0_0_30px_rgba(251,191,36,0.5)] mb-6 border-4 border-slate-900">
        <i data-lucide="trophy" class="w-12 h-12 text-slate-900"></i>
      </div>
      
      <h2 id="end-title" class="text-4xl font-black text-white mb-2"></h2>
      <p id="end-msg" class="text-slate-300 font-bold mb-6 text-lg"></p>
      
      <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700 mb-8">
        <p class="text-sm text-slate-400 font-bold uppercase tracking-widest mb-1">النقاط النهائية</p>
        <p id="final-score" class="text-6xl font-black text-yellow-400"></p>
      </div>

      <button onclick="restartGame()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-black text-xl py-4 rounded-xl transition-colors flex justify-center items-center gap-2">
        إعادة اللعب <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
      </button>
    </div>
  </div>

  <script>
    const allQuestions = [
      { q: "My mother and father are my ___.", ar: "أمي وأبي هما...", options: ["parents", "uncles", "cousins", "grandparents"], answer: "parents" },
      { q: "My father's brother is my ___.", ar: "أخو أبي هو...", options: ["uncle", "aunt", "grandson", "father"], answer: "uncle" },
      { q: "My father's sister is my ___.", ar: "أخت أبي هي...", options: ["aunt", "daughter", "son", "mother"], answer: "aunt" },
      { q: "The son of my uncle is my ___.", ar: "ابن عمي هو...", options: ["cousin", "parent", "grown-up", "nephew"], answer: "cousin" },
      { q: "A boy child is a ___.", ar: "الطفل الذكر هو...", options: ["son", "daughter", "aunt", "uncle"], answer: "son" },
      { q: "A girl child is a ___.", ar: "الطفلة الأنثى هي...", options: ["daughter", "son", "uncle", "father"], answer: "daughter" },
      { q: "The son of my son is my ___.", ar: "ابن ابني هو...", options: ["grandson", "parent", "cousin", "grandpa"], answer: "grandson" },
      { q: "The daughter of my son is my ___.", ar: "ابنة ابني هي...", options: ["granddaughter", "grown-up", "aunt", "grandma"], answer: "granddaughter" },
      { q: "Adults are also called ___.", ar: "البالغون يسمون أيضاً...", options: ["grown-ups", "children", "parents", "kids"], answer: "grown-ups" },
      { q: "My dad is a Male. My mom is a ___.", ar: "أبي ذكر. أمي...", options: ["Female", "Male", "Other", "Boy"], answer: "Female" },
      
      { q: "I ___ eat breakfast. (100%)", ar: "أنا آكل الفطور (بنسبة 100%).", options: ["always", "sometimes", "never", "rarely"], answer: "always" },
      { q: "He ___ plays tennis. (0%)", ar: "هو يلعب التنس (بنسبة 0%).", options: ["never", "usually", "often", "always"], answer: "never" },
      { q: "She ___ reads books. (80%)", ar: "هي تقرأ الكتب (بنسبة 80%).", options: ["usually", "rarely", "always", "never"], answer: "usually" },
      { q: "We ___ watch TV. (10%)", ar: "نحن نشاهد التلفاز (بنسبة 10%).", options: ["rarely", "always", "often", "usually"], answer: "rarely" },
      { q: "I ___ go to the park. (50%)", ar: "أنا أذهب للحديقة (بنسبة 50%).", options: ["sometimes", "never", "usually", "always"], answer: "sometimes" },
      { q: "How ___ do you exercise?", ar: "___ تتمرن؟ (للسؤال عن التكرار)", options: ["often", "much", "long", "many"], answer: "often" },
      { q: "___ he play football?", ar: "هل هو يلعب كرة القدم؟", options: ["Does", "Do", "Is", "Are"], answer: "Does" },
      { q: "___ they visit their uncle?", ar: "هل هم يزورون عمهم؟", options: ["Do", "Does", "Are", "Is"], answer: "Do" },
      { q: "He ___ up early.", ar: "هو يستيقظ مبكراً. (المضارع البسيط)", options: ["wakes", "wake", "waking", "woke"], answer: "wakes" },
      { q: "I ___ pizza.", ar: "أنا أحب البيتزا. (المضارع البسيط)", options: ["like", "likes", "liking", "liked"], answer: "like" }
    ];

    let playerName = "";
    let score = 0;
    let lives = 3;
    let currentQIndex = 0;
    let isPlaying = false;
    
    // تم تخفيض السرعة بنسبة 30% لتصبح بطيئة جداً ومناسبة للقراءة المريحة (من 1.4 إلى 0.98)
    let fallSpeed = 0.98; 
    let wordsArray = [];
    let animationFrameId;
    let speechEnabled = ('speechSynthesis' in window);

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    // Load saved name if exists
    window.onload = () => {
      const savedName = localStorage.getItem('alwadani_player');
      if(savedName) {
        document.getElementById('player-name').value = savedName;
      }
    };

    function playSFX(type) {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'over') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.8);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
        osc.start(); osc.stop(audioCtx.currentTime + 0.8);
      }
    }

    function speak(text) {
      if (speechEnabled) {
        window.speechSynthesis.cancel();
        const textToRead = text.replace(/___/g, 'blank');
        const utterance = new SpeechSynthesisUtterance(textToRead);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function readQuestion() {
      const qText = allQuestions[currentQIndex].q;
      speak(qText);
    }

    function startGame() {
      const nameInput = document.getElementById('player-name').value.trim();
      if (!nameInput) {
        document.getElementById('player-name').classList.add('border-red-500');
        setTimeout(() => document.getElementById('player-name').classList.remove('border-red-500'), 500);
        return;
      }
      
      playerName = nameInput;
      // حفظ الاسم للمرات القادمة
      localStorage.setItem('alwadani_player', playerName);

      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      document.getElementById('start-screen').classList.remove('active');
      document.getElementById('game-screen').classList.add('active');
      
      isPlaying = true;
      loadQuestion();
      gameLoop();
    }

    function restartGame() {
      score = 0;
      lives = 3;
      currentQIndex = 0;
      isPlaying = false;
      // إعادة السرعة لوضعها البطيء المبدئي
      fallSpeed = 0.98; 
      
      document.getElementById('result-screen').classList.remove('active');
      document.getElementById('start-screen').classList.add('active');
      
      // إعادة رسم القلوب
      const hearts = document.querySelectorAll('.heart');
      hearts.forEach(h => h.classList.remove('lost'));
    }

    function updateHUD() {
      document.getElementById('score-display').innerText = score;
      document.getElementById('q-current').innerText = currentQIndex + 1;
      document.getElementById('round-indicator').innerText = currentQIndex < 10 ? "1 (مفردات)" : "2 (قواعد)";
      
      const hearts = document.querySelectorAll('.heart');
      hearts.forEach((h, i) => {
        if (i >= lives) h.classList.add('lost');
      });
    }

    function loadQuestion() {
      if (currentQIndex >= allQuestions.length) {
        endGame(true);
        return;
      }
      
      const currentQ = allQuestions[currentQIndex];
      document.getElementById('question-text').innerHTML = currentQ.q.replace('___', '<span class="text-sky-400">______</span>');
      document.getElementById('question-ar').innerText = currentQ.ar;
      
      updateHUD();
      readQuestion();
      spawnWords(currentQ);
      
      // زيادة بطيئة جداً للسرعة كل 5 أسئلة
      if (currentQIndex > 0 && currentQIndex % 5 === 0) {
        fallSpeed += 0.15;
      }
    }

    function spawnWords(qData) {
      const gameArea = document.getElementById('game-area');
      gameArea.innerHTML = ''; 
      wordsArray = [];
      
      const options = [...qData.options].sort(() => Math.random() - 0.5);
      const areaWidth = gameArea.clientWidth;

      options.forEach((opt, index) => {
        const wordEl = document.createElement('div');
        wordEl.className = 'falling-word';
        wordEl.innerText = opt;
        
        const randomX = Math.max(10, Math.random() * (areaWidth - 140));
        
        // تعديل المسافة بين الكلمات لكي لا تتكدس نظراً لبطء السرعة
        const randomYOffset = -50 - (index * 130) - (Math.random() * 40); 
        
        wordEl.style.left = `${randomX}px`;
        wordEl.style.top = `${randomYOffset}px`;
        
        wordEl.onpointerdown = () => checkAnswer(opt, wordEl);

        gameArea.appendChild(wordEl);
        wordsArray.push({ el: wordEl, y: randomYOffset, active: true });
      });
    }

    function checkAnswer(selectedOpt, element) {
      if (!isPlaying) return;
      
      speak(selectedOpt);
      const correctAnswer = allQuestions[currentQIndex].answer;
      
      wordsArray.forEach(w => w.active = false);

      if (selectedOpt === correctAnswer) {
        playSFX('correct');
        score += 10;
        element.classList.add('pop-effect');
        
        const qBar = document.getElementById('question-bar');
        qBar.style.borderColor = '#22c55e';
        qBar.style.backgroundColor = 'rgba(34, 197, 94, 0.2)';
        
        setTimeout(() => {
          qBar.style.borderColor = 'rgba(56, 189, 248, 0.3)';
          qBar.style.backgroundColor = 'var(--panel)';
          currentQIndex++;
          loadQuestion();
        }, 800);

      } else {
        handleMistake(element);
      }
    }

    function handleMistake(element) {
      playSFX('wrong');
      lives--;
      updateHUD();
      
      if (element) {
        element.classList.add('shake-effect');
      }

      const qBar = document.getElementById('question-bar');
      qBar.style.borderColor = '#ef4444';
      qBar.style.backgroundColor = 'rgba(239, 68, 68, 0.2)';

      setTimeout(() => {
        qBar.style.borderColor = 'rgba(56, 189, 248, 0.3)';
        qBar.style.backgroundColor = 'var(--panel)';
        
        if (lives <= 0) {
          endGame(false);
        } else {
          currentQIndex++;
          loadQuestion();
        }
      }, 800);
    }

    function gameLoop() {
      if (!isPlaying) return;
      
      const gameAreaHeight = document.getElementById('game-area').clientHeight;
      let missedWord = false;

      wordsArray.forEach(wordObj => {
        if (wordObj.active) {
          wordObj.y += fallSpeed;
          wordObj.el.style.top = `${wordObj.y}px`;
          
          if (wordObj.y > gameAreaHeight - 50) {
            missedWord = true;
          }
        }
      });

      if (missedWord) {
        wordsArray.forEach(w => w.active = false);
        handleMistake(null);
      }

      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function endGame(isWin) {
      isPlaying = false;
      cancelAnimationFrame(animationFrameId);
      
      document.getElementById('game-screen').classList.remove('active');
      document.getElementById('result-screen').classList.add('active');
      
      document.getElementById('final-score').innerText = score;
      const titleEl = document.getElementById('end-title');
      const msgEl = document.getElementById('end-msg');

      if (isWin) {
        playSFX('correct'); 
        titleEl.innerText = "أنت محقق أسطوري! 🌟";
        titleEl.className = "text-4xl font-black mb-2 text-green-400";
        msgEl.innerText = `عمل رائع يا ${playerName}، لقد اصطدت الكلمات ببراعة!`;
      } else {
        playSFX('over');
        titleEl.innerText = "انتهت المحاولات! 💔";
        titleEl.className = "text-4xl font-black mb-2 text-red-400";
        msgEl.innerText = `لا بأس يا ${playerName}، لقد وصلت للسؤال ${currentQIndex + 1}. حاول مجدداً!`;
      }
    }

    lucide.createIcons();
  </script>
</body>
</html>
